name: Bug report
description: Report a reproducible defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first to avoid duplicates.
        Security defects (anything that could leak a key or bypass a gate) must not be filed publicly —
        use the private channels in [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The version string shown in the About panel (including build time), or a commit hash
      placeholder: "v2.13.3 (2026-10-24 12:00)"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 27.0.1 (26A434), Apple Silicon, installed from dmg / built from source"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → MCP / Agent collaboration
        2. Turn on the CodeBuddy switch
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include the exact error text, log paths (e.g. /tmp/coffer-mcp-register.log) and screenshots
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Does it reproduce reliably? What is affected (which capabilities stop working)?
    validations:
      required: false
