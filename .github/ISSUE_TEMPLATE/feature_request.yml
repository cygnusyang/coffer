name: Feature request
description: Suggest a capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the situation and the blocker, not the solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        > Scope reminder: Coffer is "your data never leaves this machine". Anything requiring key upload,
        > cloud sync or a server-side account is out of scope by default unless it can be shown that key
        > material still never leaves the device.
