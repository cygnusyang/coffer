name: Feature request
description: 提出一个功能需求 / Suggest a capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / Problem
      description: 描述场景与卡点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解法 / Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 已试过的替代方案 / Alternatives considered
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        > 范围提醒：Coffer 的定位是「数据不出本机」。任何需要上传密钥 / 云端同步 / 服务端账号的方案默认不在范围内，除非能证明密钥材料仍只在本机。
