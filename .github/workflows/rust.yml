name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
      working-directory: core
    - name: Run tests（可靠门禁：跳 2 条问题用例，coffer-test-gate 纪律）
      run: cargo test --workspace --no-fail-fast -- --skip 极端kdf参数建库记录与解锁往返 --skip 千条搜索基线
      working-directory: core
    - name: Run MCP smoke
      run: bash tools/run_mcp_smoke.sh

  docs-facts:
    name: 文档事实核查 + 任务板完整性
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: check_docs_facts.sh（README 子命令 / 版本 / 链接 / entitlements / OTA 白名单）
      run: bash tools/check_docs_facts.sh
    - name: workitem.py check（任务板列结构 / 重复 ID / 必填证据）
      run: python3 tools/workitem.py check
