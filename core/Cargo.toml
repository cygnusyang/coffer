# Coffer —— Rust 核心工作区
#
# 目录划分见 docs/02-概要设计.md §2.2「工程结构」。
#
# ⚠️ 依赖版本说明
#    标记 [已确认] 的版本号来自 crates.io API 实测（2026-09-24），可放心使用。
#    标记 [待校准] 的版本号尚未核对，需要在 M0/M1 阶段用 `cargo add` 或
#    `cargo update` 校准 —— 不要凭印象相信这些约束。

[workspace]
resolver = "2"
members = [
    # 基础设施层
    "cf-crypto",
    "cf-format",
    "cf-store",
    # 领域层
    "cf-domain",
    # 基础设施层（续）
    "cf-importer",
    "cf-exporter",
    "cf-totp",
    "cf-audit",
    # 应用服务层
    "cf-session",
    # 绑定层
    "cf-ffi",
    # 测试支持
    "cf-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/cygnusyang/coffer"
authors = ["Coffer contributors"]

[workspace.dependencies]

# ---------- 密码学 ----------
# [已确认] argon2 0.6.0 —— KDF。官方示例确认 hash_password_into 仍是推荐的
#          「派生密钥」用法（区别于 hash_password 的 PHC 字符串用法）。
argon2 = "0.6.0"

# [已确认] chacha20poly1305 0.11.0 —— XChaCha20-Poly1305 AEAD
#          0.11 起已并入主 crate：XChaCha20Poly1305 无需额外 feature
chacha20poly1305 = "0.11.0"

# [已确认] HKDF 子密钥派生（M1-0 实测：解析到 hkdf 0.12.4）
#          `expand(info: &[u8], &mut okm) -> Result<(), InvalidLength>`，
#          与 docs/03-详细设计.md §2.4 伪代码一致；expand 返回 Result，
#          包装函数无需 .expect（cf-crypto 禁 expect）。
hkdf = "0.12"
# [已确认] SHA-2 家族 / HMAC（M1-0 实测）
#          sha2 0.10.9 提供 HKDF 的 Sha256 哈希类型，编译通过；
#          hmac 0.12.1 为 hkdf 的传递依赖，cf-crypto 不再直接使用；
#          sha1 暂未使用（TOTP 已委托 totp-rs）。
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"

# [已确认] getrandom 0.4.3 —— 注意：0.4 与 0.2/0.3 的 API 差异较大，
#          使用前请核对 docs.rs/getrandom/0.4.3
getrandom = "0.4.3"

# [待校准] 内存清零。必须在 drop 时真的清零，不能依赖编译器不优化掉。
zeroize = { version = "1", features = ["zeroize_derive"] }

# [待校准] Unicode NFC 归一化 —— 主密码处理必需，见 docs/03-详细设计.md §2.2
unicode-normalization = "0.1"

# [已确认] 常量时间比较。已启用：cf-session 的 constant_time_eq 与
#           cf-totp 的 verify 码值比对均改用此库（时序侧信道防护）
subtle = "2"

# [已确认] totp-rs 5.7.2 —— TOTP (RFC 6238) 委托实现
#           锁 5.7.2 不升 6.0：保持 MSRV 1.85（6.0 抬高 MSRV 且 API 有 breaking 变更）。
#           HMAC-SHA1 计算交由 totp-rs，cf-totp 只保留门面。
#           MSRV 实测：5.7.2 声明 rust-version 1.66，兼容 workspace 的 1.85。
#           不开默认 features 之外的特性：默认 features 为空，SHA1/HMAC 为
#           必选依赖；不启用 otpauth（cf-totp 保留自有 URI 解析，不需要 url 依赖）。
totp-rs = "5.7.2"

# [已确认] zxcvbn 3.1.1 —— 密码强度评估（Dropbox zxcvbn 的 Rust 移植）
#           FR-6.1 弱密码检测。纯 CPU 计算，不引入网络依赖（cf-audit 硬约束）。
zxcvbn = "3.1.1"

# [已确认] passwords 3.1.18 —— 密码生成器
#           FR-3 随机密码生成。基于 getrandom/CSPRNG，供 cf-audit 与后续 UI 使用。
passwords = "3.1.18"

# [已确认] keepass 0.13.25 —— KeePass KDBX 数据库解析
#           锁 0.13.25 不升 0.15：实测 rust-version 1.85.1，
#           高于 workspace 声明的 1.85（本地 stable 1.98 可编译，CI 需 ≥1.85.1）。
#           仅用于读取（导入方向），不承担 KDBX 写入（导出见 cf-exporter）。
keepass = "0.13.25"

# ---------- 序列化 ----------
# [待校准] 1PUX 解析需要 JSON；内部快照用 CBOR
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# ---------- 存储 ----------
# [待校准] SQLite（bundled 编译，保证版本一致，见 docs/02-概要设计.md §3）
rusqlite = { version = "0.32", features = ["bundled"] }

# ---------- ID 与时间 ----------
# [待校准] UUIDv7（时间有序，利于索引）
uuid = { version = "1", features = ["v7", "serde"] }

# ---------- 错误与日志 ----------
# [待校准] thiserror 2.x
thiserror = "2"
tracing = "0.1"

# ---------- FFI ----------
# [已确认] uniffi 0.32.2 —— Rust ↔ Kotlin/Swift 绑定
uniffi = "0.32.2"

# ---------- 内部 crate 互引 ----------
cf-crypto   = { path = "cf-crypto" }
cf-format   = { path = "cf-format" }
cf-store    = { path = "cf-store" }
cf-domain   = { path = "cf-domain" }
cf-importer = { path = "cf-importer" }
cf-exporter = { path = "cf-exporter" }
cf-totp     = { path = "cf-totp" }
cf-audit    = { path = "cf-audit" }
cf-session  = { path = "cf-session" }
cf-ffi      = { path = "cf-ffi" }

# ---------- Release 配置 ----------
# 密码学场景下宁可慢一点也要保证行为正确，但 LTO 对最终二进制体积
# 与性能都有明显收益，故 release 启用。
[profile.release]
lto = true
codegen-units = 1
# C-8（docs/07 §5）：必须是 unwind，不能 abort。
# UniFFI 的 FFI 边界依赖 unwind 捕获 Rust panic 并转为抛给 Swift 的错误；
# panic = "abort" 会让任何 Rust panic 直接杀死整个 App。
# 兜底防线是 cf-ffi 的 ffi_guard（catch_unwind → FfiError），见 cf-ffi/src/lib.rs。
# 取舍：unwind 在 panic 路径上比 abort 略慢且二进制略大——但 panic 本应是
# 不变量破坏信号而非控制流，正常路径零成本，安全收益（App 存活 + 可上报）远大于代价。
panic = "unwind"

# 标定与基准测试用：比 release 更激进，但保留调试符号便于排查
[profile.bench]
lto = true
codegen-units = 1
debug = true
