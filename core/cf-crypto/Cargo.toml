[package]
name = "cf-crypto"
description = "Coffer 加密原语封装：Argon2id KDF、XChaCha20-Poly1305 AEAD、CSPRNG、内存清零"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
unicode-normalization = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
# HKDF 子密钥派生（docs/03-详细设计.md §2.4）。
# hkdf 0.12 的 `expand(info: &[u8], &mut okm)` 签名与设计文档伪代码一致，
# 需同时引入 sha2 提供 `Hkdf::<Sha256>` 的哈希类型。
hkdf = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# 基准测试（examples/bench_kdf.rs）只使用 std::time，无外部依赖
