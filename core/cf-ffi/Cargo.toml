[package]
name = "cf-ffi"
description = "通过 UniFFI 暴露接口给 Kotlin / Swift，负责类型与错误映射。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Swift 侧消费形态（tools/build_swift_bindings.sh）：
# - cdylib   → uniffi-bindgen --library 提取绑定元数据
# - staticlib → Xcode 静态链接（macos/Coffer/CoreBindings/libcf_ffi.a）
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
cf-session = { workspace = true }
cf-domain = { workspace = true }
cf-crypto = { workspace = true }
cf-store = { workspace = true }
cf-format = { workspace = true }
cf-audit = { workspace = true }
cf-importer = { workspace = true }
# 备份导出 / 校验 / 恢复（FR-8.1/8.6）与明文 CSV 导出（FR-8.3）
cf-exporter = { workspace = true }
uniffi = { workspace = true }
thiserror = { workspace = true }
# 官方装配预热结果落日志（M2，见 src/official.rs）：仅官方 feature 下使用，故
# optional + 随 official-license 启用，公开构建依赖闭包不引入（TC-BLD-02 纪律）。
# 与 cf-mcp 同 workspace tracing，非新依赖。
tracing = { workspace = true, optional = true }
# strength_estimate：zxcvbn 评估 + feedback（建议/告警文案）
zxcvbn = { workspace = true }
# open_vault：vault uuid 合法性校验（防路径拼接逃逸）
uuid = { workspace = true }
# 官方许可装配（vendored，闭源）：feature `official-license` 门控。默认关闭——
# 公开仓自编译不含任何许可符号（TC-BLD-02），行为 = PermitAll 免费版；
# 官方构建先跑 tools/bootstrap_official_license.sh（vendor 覆盖为真实副本）
# 再 `--features official-license` 构建。依赖方向纪律：cf-ffi 默认不感知
# cf-license（单向依赖 cf-license → cf-domain 只在官方 feature 下出现）。
cf-assemble = { workspace = true, optional = true }
# 官方装配模块（src/official.rs）直接构造真实依赖：cf-keychain 的真实
# KeychainStore（MacKeychainStore）+ cf-license 的指纹 / 时钟 / 数据存在性
# 探针。default-features = false 机制性排除 mock（InMemoryKeychain，MEDIUM-2
# 同纪律：真实 Keychain 只能经 cf-keychain 注入）。
cf-license = { workspace = true, optional = true, default-features = false }
cf-keychain = { workspace = true, optional = true }

[features]
default = []
# 官方许可装配（闭源 vendored）：启用 cf-assemble（含 cf-license/cf-keychain）
# 并编译 src/official.rs 的 install_official_license 导出。需要 vendor 目录已
# bootstrap（tools/bootstrap_official_license.sh）。Swift 侧配 `-D OFFICIAL_LICENSE`
# 编译官方适配（见 OfficialLicenseService.swift）。
official-license = ["dep:cf-assemble", "dep:cf-license", "dep:cf-keychain", "dep:tracing"]
# Swift/Kotlin 绑定生成器入口（tools/build_swift_bindings.sh 专用；
# 运行时与测试不需要）。启用后 `cargo run --features bindgen-cli --bin uniffi-bindgen`。
bindgen-cli = ["uniffi/cli"]

# uniffi-bindgen CLI（Mozilla 推荐模式：版本与 uniffi runtime 锁死，避免
# 独立安装的 uniffi-bindgen 版本漂移导致生成物与 scaffolding 不匹配，docs/07 R-1）
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

# T04 阶段 2：UniFFI proc-macro 绑定（CofferApp 工厂 + VaultSession 会话门面）

[dev-dependencies]
# QA 集成测试：外部裸连接制造 SQLite 写冲突（1009 跨 FFI 形态验证）
rusqlite = { workspace = true }
