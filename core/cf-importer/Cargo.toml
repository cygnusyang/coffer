[package]
name = "cf-importer"
description = "1PUX / CSV / Bitwarden JSON / opvault 等格式的解析、字段映射与预检报告。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cf-domain = { workspace = true }
cf-crypto = { workspace = true }
cf-store = { workspace = true }
cf-totp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# UUIDv7：导入固定「全部新建」策略的条目 / 字段 / TOTP 行 ID（docs/07 §3.3）
uuid = { workspace = true }
# 1PUX 交换容器（docs/03 §1.4 同款选择）：标准 ZIP + Deflate，MIT 许可
# （NFR-LEGAL-02）。版本与 feature 照抄 cf-exporter：关闭默认 features
# （AES-ZipCrypto/bzip2/lzma/zstd/time 均不需要），只保留 deflate——
# 压缩面越小攻击面越小。1PUX 导出未加密，解析全程无密钥。
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# p256（RustCrypto，MIT/Apache——NFR-LEGAL-02；docs/17 §10 裁定 #6 批准）：
# 仅 Bitwarden 导入路径的私钥归一化解析与校验（SEC1/PKCS#8 DER → PKCS#8，
# docs/17 §3.1 D-1），无签名运行面（D-2：断言签名随 ADP 重启时引入）。
# 依赖树全量 MSRV 1.85，与 workspace 一致（2026-09-29 实核 registry 元数据）。
p256 = { version = "0.14.0", features = ["pkcs8"] }
# base64：fido2Credentials 的 credentialId / userHandle / 私钥 DER 解码
# （Bitwarden 用 URL-safe 无 padding，宽容解码四种形态全兼容）。
# 版本与 feature 照抄 cf-store 既有选择。
base64 = "0.22"

[dev-dependencies]
# KeePass KDBX 冒烟验证：读取方向为主（cf-exporter 的写入另行选择方案）。
# save_kdbx4 仅测试需要：用最小内存数据库 保存→重开 证明解析链路可用。
keepass = { workspace = true, features = ["save_kdbx4"] }
# 集成测试用内存 SQLite（构造 ItemStore 门面）
rusqlite = { workspace = true }
# 1PUX 集成测试的临时 vault 目录（附件旁路文件落盘）
tempfile = "3"
# 属性测试（模糊测试基建）：任意字节下 CSV / 1PUX 解析不 panic。
# 见 tests/proptest_fuzz.rs。仅测试构建，不进 normal 依赖树。
proptest = { workspace = true }

# 状态：CSV（docs/07 §7 T03）与 1PUX（docs/09 v0.3.0-T01）已实现；
# Bitwarden JSON 已实现（docs/17 §4.2 PK2，v0.5.0）；opvault / KDBX 推后
