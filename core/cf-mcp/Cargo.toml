[package]
name = "cf-mcp"
description = "MCP（Model Context Protocol）服务——Agent 凭据网关（docs/20-MCP设计.md）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 依赖方向（docs/20 §2.2，硬约束）：
#   MVP 只依赖 cf-domain（CfError / SecretString / item 模型）+ 序列化 + thiserror + zeroize。
#   不依赖 cf-session / cf-store / cf-ffi；审计轨迹不复用 cf-audit（§2.3 分层语义违规）。
#   hmac / sha2 + cf-uds-sys（docs/20 §2.2 replay challenge 指纹 / §3.6 peer 凭据）为
#   `--uds` 传输所需——v2.1.0 D-4 已实现 `--uds`（docs/27），故作为**常规**依赖引入
#   （UDS 与 provider 正交，两个 feature 构建面均可用）。均无网络能力（AF_UNIX 本机
#   回环，docs/27 D-4 零网络新口径；check_no_network 黑名单不含之）。
[dependencies]
cf-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
# UDS 传输（docs/20 §3.6，v2.1.0 D-4）：
#   hmac / sha2 —— 会话 challenge 指纹（HMAC-SHA256，§3.6 ③，docs/20 §2.2 行）；
#   cf-uds-sys —— macOS peer 凭据 syscall 安全封装（§3.6 ② LOCAL_PEERPID /
#   getpeereid；cf-mcp 是 forbid(unsafe_code) crate，unsafe 面隔离在 sys crate）。
hmac = { workspace = true }
sha2 = { workspace = true }
cf-uds-sys = { path = "../cf-uds-sys" }

# CofferStoreProvider（docs/20 §4.5，生产实现）经 `coffer-store` feature 才引入
# cf-session（→ cf-store → cf-crypto / cf-format / cf-domain，单向）。
# MVP 默认关闭：不启用该 feature 时，cf-mcp 依赖树不含 cf-session/cf-store。
cf-session = { workspace = true, optional = true }
# 仅在 coffer-store feature 下需要：cf-session 已传递引入 cf-crypto（cf-store 下层），
# 本处直列仅为让 in-crate 测试可命名 `KdfParams` 走快速建库档（避免默认 256 MiB
# KDF 的秒级建库）。feature 关闭时依赖树不含 cf-crypto（docs/20 §2.2 只下不上）。
cf-crypto = { workspace = true, optional = true }
# 仅在 coffer-store feature 下需要：MEDIUM-2 轮换新值用 Coffer 生成器强随机值
# （cf-audit `generate_password`，FR-3.2 CSPRNG，docs/27 MEDIUM-2 裁定 B）。注意
# **仅**复用其生成器，**不**复用其审计轨迹（§2.3 分层语义，AS-10 审计归本包
# `audit` 模块，cf-audit 是弱/重复/陈旧密码体检 FR-6）。feature 关闭时依赖树
# 不含 cf-audit（docs/20 §2.2 只下不上；check_no_network 基线随 default 重标）。
cf-audit = { workspace = true, optional = true }
# 仅在 coffer-store feature 下需要：MCP 托管条目读取（docs/29 §4.2/§4.3-G3a）——
# cf-escrow-keychain 是 macOS Keychain 只读封装（unsafe 面隔离，cf-mcp 保持
# forbid(unsafe_code)，cf-mcp → cf-uds-sys 先例同构）。平台以 `cfg(target_os="macos")`
# 在该 crate 内表达（workspace 惯例：Cargo.toml 无 target 门控，同 cf-uds-sys；
# 非 macOS 分支编译期不触 FFI）。feature 关闭时依赖树不含（docs/20 §2.2 只下不上）。
cf-escrow-keychain = { path = "../cf-escrow-keychain", optional = true }

[features]
default = ["coffer-store"]
# 启用 Coffer 自家 Secret Store provider（D-2 用户裁定：缺省 provider = coffer，
# coffer-store 转 default feature，docs/27 D-2）。依赖边 cf-mcp → cf-session →
# cf-store（docs/20 §2.2，§9.2 互斥核对）；`--no-default-features` 才瘦依赖树。
coffer-store = [
    "dep:cf-session",
    "dep:cf-crypto",
    "dep:cf-audit",
    "dep:cf-escrow-keychain",
]

# `coffer` 二进制（docs/20 §5.1）：本包产 `[[bin]] name = "coffer"`（bin-in-crate，
# 沿用 cf-ffi `uniffi-bindgen` 先例），未来 `coffer list/run/…` 扩进同一 bin 或
# 独立 cf-cli crate（届时再裁，本版只管 `mcp` 子命令）。
[[bin]]
name = "coffer"
path = "src/main.rs"

[dev-dependencies]
serde_json = { workspace = true }
cf-domain = { workspace = true }
