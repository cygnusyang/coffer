[package]
name = "cf-mcp"
description = "MCP（Model Context Protocol）服务——Agent 凭据网关（docs/20-MCP设计.md）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 依赖方向（docs/20 §2.2，硬约束）：
#   MVP 只依赖 cf-domain（CfError / SecretString / item 模型）+ 序列化 + thiserror + zeroize。
#   不依赖 cf-session / cf-store / cf-ffi；审计轨迹不复用 cf-audit（§2.3 分层语义违规）。
#   hmac / sha2（§2.2 replay challenge 指纹）为 --uds 传输所需；MVP 只 stdio（D-4），
#   故本版不引入，`--uds` 上架时补（文档：docs/20 §3.1 / §3.6）。
[dependencies]
cf-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
