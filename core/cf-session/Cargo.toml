[package]
name = "cf-session"
description = "解锁 / 锁定、用例编排、权限门禁、空闲计时判定、TOTP 验证。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cf-domain = { workspace = true }
cf-store = { workspace = true }
cf-format = { workspace = true }
cf-crypto = { workspace = true }
cf-totp = { workspace = true }
# 建库/换密门禁 + Watchtower 体检（FR-1.3、FR-6.2/6.3：strength 门禁、
# HMAC 指纹 / 弱密码复检 / 弱 URL 纯函数，docs/09 §3.5 冻结契约）
cf-audit = { workspace = true }
# T04：VaultSession::import_csv 薄委托 cf-importer（T03 偏差记录预留的落点，
# cf-ffi 由此获得导入能力而不必触碰 ItemStore 内部）
cf-importer = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
# 解锁流：打开 db.sqlite / 生成条目 UUIDv7
rusqlite = { workspace = true }
uuid = { workspace = true }
# header.json 内各 *_b64 字段编解码（与 cf-format 同版本 0.22）
base64 = "0.22"
# 搜索匹配归一化（docs/03 §3.3：NFC + 小写折叠，与解锁流密码归一化同构）
unicode-normalization = { workspace = true }
# FR-11.2 词级近似匹配（docs/09 §3.6 裁定：strsim 而非自写 Unicode 编辑距离；
# MIT/Apache，直接声明版本避免动共享的 workspace 依赖表）
strsim = "0.11"
# FR-17.2 恢复码 128-bit CSPRNG（docs/31 §2.1）：与 cf-crypto aead 的
# nonce 生成同源（getrandom::fill），仓库既有 CSPRNG 用法。workspace 依赖，
# 直列本 crate 直接使用。
getrandom = { workspace = true }
# FR-17.2 恢复码 BIP39-12 编码（docs/31 §2.2 D-3 用户裁定：需新增依赖）：
# 仅 cf-session 的 recovery 模块消费 → 直列本 crate（最小依赖面，strsim /
# base64 先例），不进 cf-crypto——cf-crypto 是被多 crate 依赖的地基，引入
# bip39 会把编码器拖进 cf-format/cf-store/cf-ffi 的依赖图而它们并不使用。
# bip39 3.x 默认只带英文词表（ASCII），恢复码生成方与消费方均在 Rust 侧，
# 无跨语言词表一致性问题。`zeroize` feature：Mnemonic 持词索引（编码熵），
# Drop 自动清零（NFR-SEC-04，与 SessionKey 同纪律）；zeroize 为 workspace
# 既有依赖，无新增下载。
bip39 = { version = "3", features = ["zeroize"] }
# FR-8.3 CSV 导出薄委托（export_gate，与 cf-importer 导入委托同模式；
# cf-exporter 不依赖 cf-session，无循环）
cf-exporter = { workspace = true }

[dev-dependencies]
cf-crypto = { workspace = true }
cf-store = { workspace = true }
# 验收用例（docs/10）构造 ItemDraft / TotpUpdate 等领域类型
cf-domain = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
# history 快照密文落盘断言：与 cf-store 同版本序列化 CBOR 对拍
ciborium = { workspace = true }

# 状态：T02 已实现（真实解锁流 / VaultSession / idle 纯函数 / CRUD 与搜索编排 /
#       错误统一 C-6）；CSV 导入编排（usecase/import_csv）待 T03 集成。
