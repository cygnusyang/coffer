<path d="M 600 544 C 420 520, 350 260, 254 240"/>
<path d="M 600 556 C 510 550, 470 400, 522 378"/>
<path d="M 600 572 C 470 580, 390 400, 254 380"/>
<!-- cf-importer -->
<path d="M 870 392 C 620 360, 420 250, 254 232"/>
<path d="M 870 424 C 640 478, 420 396, 254 376"/>
<path d="M 870 398 C 830 380, 830 300, 794 268"/>
<path d="M 940 436 C 900 600, 480 630, 254 516"/>
<!-- cf-session -->
<path d="M 1220 260 C 940 140, 420 150, 168 202"/>
<path d="M 1140 272 C 1000 272, 950 268, 794 262"/>
<path d="M 1140 266 C 880 220, 660 300, 524 356"/>
<path d="M 1220 316 C 1100 540, 500 470, 254 390"/>
<path d="M 1205 316 C 1140 620, 560 650, 254 526"/>
<path d="M 1140 294 C 990 330, 900 380, 794 406"/>
<path d="M 1140 306 C 1110 330, 1090 380, 1064 400"/>
<!-- cf-ffi -->
<path d="M 1410 288 L 1334 288"/>
<path d="M 1500 260 C 1150 90, 420 100, 172 202"/>
<path d="M 1520 316 C 1420 680, 540 540, 254 396"/>
<path d="M 1410 272 C 1220 220, 1000 240, 794 254"/>
<path d="M 1410 262 C 1140 130, 620 190, 526 342"/>
<path d="M 1410 296 C 1210 330, 1010 360, 794 398"/>
<path d="M 1410 302 C 1300 340, 1180 386, 1066 402"/>
