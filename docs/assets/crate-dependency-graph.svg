<path d="M 330 368 L 254 368"/>
<!-- cf-store -->
<path d="M 600 244 C 440 232, 340 236, 254 228"/>
<path d="M 600 276 C 560 280, 560 346, 524 352"/>
<path d="M 600 262 C 460 268, 380 350, 254 362"/>
