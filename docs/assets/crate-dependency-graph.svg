<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="800" viewBox="0 0 1660 800" role="img" aria-labelledby="title desc">
<title id="title">Coffer 核心工作区 crate 依赖图</title>
<desc id="desc">Coffer 11 个 crate 的直接依赖关系图，依赖方向自右向左，全部单向。数据实测自各 crate Cargo.toml 的 dependencies 段。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
</defs>
<rect width="1660" height="800" rx="20" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="49" font-size="28" fill="#0f172a" font-weight="700">Coffer 核心工作区 · crate 直接依赖图</text>
<text x="40" y="78" font-size="16" fill="#64748b">29 条直接依赖边，方向自右向左（依赖 → 被依赖），全部单向、无环 · 实测自各 crate Cargo.toml [dependencies]（2026-09-28）</text>

<!-- 图例 -->
<rect x="40" y="96" width="1580" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="60" y="106" width="18" height="18" rx="4" fill="#f5f3ff" stroke="#7c3aed"/><text x="84" y="120" font-size="14" fill="#334155">领域层</text>
<rect x="160" y="106" width="18" height="18" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="184" y="120" font-size="14" fill="#334155">基础设施层</text>
<rect x="290" y="106" width="18" height="18" rx="4" fill="#fffbeb" stroke="#d97706"/><text x="314" y="120" font-size="14" fill="#334155">应用服务层</text>
<rect x="420" y="106" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="444" y="120" font-size="14" fill="#334155">绑定层</text>
<rect x="510" y="106" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="534" y="120" font-size="14" fill="#334155">测试支持</text>
<text x="1580" y="121" font-size="14" fill="#94a3b8" text-anchor="end">箭头：A → B 表示 A 依赖 B</text>

<!-- ===== 依赖边（先画，压在盒子下面） ===== -->
<g fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.55" marker-end="url(#arr)">
