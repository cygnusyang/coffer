<!-- footnotes -->
<text x="40" y="940" font-size="14" fill="#64748b">Reading order: cf-ffi (UI binding) and cf-mcp (CLI / MCP gateway, separate process) are the two outward boundaries; cf-session orchestrates; cf-domain / cf-crypto / cf-totp / cf-uds-sys / cf-escrow-keychain have no internal deps.</text>
<text x="40" y="962" font-size="14" fill="#94a3b8">Note: cf-ffi also links directly to cf-domain/cf-crypto/cf-store/cf-format/cf-audit/cf-importer/cf-exporter; cf-mcp's feature-gated deps add cf-session/cf-crypto/cf-audit/cf-escrow-keychain. One-way intact; see architecture overview §3.4.</text>
</g>
