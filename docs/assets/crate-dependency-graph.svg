<path d="M 620 660 C 420 580, 320 300, 240 258"/>
<path d="M 600 672 C 460 650, 350 420, 254 384"/>
</g>

<!-- ===== crate 盒子 ===== -->
<!-- 领域层 -->
<g>
<rect x="60" y="200" width="190" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="155" y="224" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-domain</text>
<text x="155" y="246" font-size="12.5" fill="#4c1d95" text-anchor="middle">领域模型 · 22 类模板 · 校验</text>
</g>
<!-- 基础设施层 -->
<g>
<rect x="60" y="340" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="155" y="364" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-crypto</text>
<text x="155" y="386" font-size="12.5" fill="#1e40af" text-anchor="middle">KDF · AEAD · HKDF · 清零</text>
</g>
<g>
<rect x="60" y="480" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="155" y="504" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-totp</text>
<text x="155" y="526" font-size="12.5" fill="#1e40af" text-anchor="middle">RFC 6238 门面（SHA-1）</text>
</g>
<g>
<rect x="330" y="340" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="425" y="364" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-format</text>
<text x="425" y="386" font-size="12.5" fill="#1e40af" text-anchor="middle">容器头读写 · 版本识别 · 迁移</text>
</g>
<g>
<rect x="600" y="230" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="695" y="254" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-store</text>
<text x="695" y="276" font-size="12.5" fill="#1e40af" text-anchor="middle">SQLite · 字段级加密 · 事务</text>
</g>
<g>
<rect x="600" y="390" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="695" y="414" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-audit</text>
<text x="695" y="436" font-size="12.5" fill="#1e40af" text-anchor="middle">zxcvbn 强度 · 密码生成</text>
</g>
<g>
<rect x="600" y="530" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="695" y="554" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-exporter</text>
<text x="695" y="576" font-size="12.5" fill="#1e40af" text-anchor="middle">导出（占位，v0.2 交付）</text>
</g>
<g>
<rect x="870" y="380" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="965" y="404" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-importer</text>
<text x="965" y="426" font-size="12.5" fill="#1e40af" text-anchor="middle">CSV / 1PUX / opvault 导入</text>
</g>
<!-- 应用服务层 -->
<g>
<rect x="1140" y="260" width="190" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="1235" y="284" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-session</text>
<text x="1235" y="306" font-size="12.5" fill="#92400e" text-anchor="middle">会话 · 用例编排 · 权限门禁</text>
</g>
<!-- 绑定层 -->
<g>
<rect x="1410" y="260" width="190" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="1505" y="284" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-ffi</text>
<text x="1505" y="306" font-size="12.5" fill="#065f46" text-anchor="middle">UniFFI 唯一对外边界</text>
</g>
<!-- 测试支持 -->
<g>
<rect x="600" y="660" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="695" y="684" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">cf-testkit</text>
<text x="695" y="706" font-size="12.5" fill="#475569" text-anchor="middle">夹具 · 合成样本（占位）</text>
</g>

<!-- 底注 -->
<text x="40" y="768" font-size="14" fill="#64748b">阅读顺序：右端 cf-ffi 是唯一对外边界；cf-session 编排；左端 cf-crypto / cf-totp / cf-domain 无任何内部依赖。</text>
<text x="40" y="790" font-size="14" fill="#94a3b8">注意：cf-ffi 除 cf-session 外还直连 cf-domain / cf-crypto / cf-store / cf-format / cf-audit / cf-importer（类型与错误映射所需）；cf-session 直依赖 cf-importer。单向性未破坏，但与「每层只碰下一层」的理想表述有出入，详见 docs/11-架构总览与模块设计.md §3.4。</text>
</g>
</svg>
