<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1026" viewBox="0 0 1660 1026" role="img" aria-labelledby="title desc">
<title id="title">Coffer Core Workspace — crate Dependency Graph</title>
<desc id="desc">Direct dependency graph of the 15 Coffer crates: edges point right to left and are all one-way. Measured from the [dependencies] section of each crate's Cargo.toml.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1660" height="1026" rx="20" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="49" font-size="28" fill="#0f172a" font-weight="700">Coffer Core Workspace · crate Direct Dependency Graph</text>
<text x="40" y="78" font-size="16" fill="#64748b">40 direct edges (36 solid + 4 feature-gated dashed), right to left (dependent → dependency), all one-way, acyclic · measured from each crate's Cargo.toml [dependencies] (2026-10-17)</text>

<g transform="translate(0,26)">
