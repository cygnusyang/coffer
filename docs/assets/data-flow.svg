<text x="270" y="914" font-size="15" fill="#0f172a" font-weight="700">cf-importer</text>
<text x="270" y="936" font-size="12" fill="#1e40af">RFC 4180 own parser</text>
<text x="270" y="954" font-size="12" fill="#1e40af">DoS caps: 50MB / 10k rows</text>
<text x="270" y="970" font-size="12" fill="#1e40af">/ 64 KiB field / 64 cols</text>
<rect x="450" y="890" width="173" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
