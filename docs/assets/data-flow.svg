<text x="855" y="744" font-size="15" fill="#0f172a" font-weight="700">cf-totp</text>
<text x="855" y="766" font-size="12" fill="#1e40af">RFC 6238 gen (80-bit min)</text>
<text x="855" y="784" font-size="12" fill="#1e40af">verify tolerates ±1 window</text>
<rect x="1035" y="720" width="173" height="88" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
