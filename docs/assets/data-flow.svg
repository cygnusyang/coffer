<text x="40" y="876" font-size="18" fill="#0f172a" font-weight="700">Flow E · CSV Import (import_csv)</text>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)">
<path d="M 233 942 L 251 942"/><path d="M 428 942 L 446 942"/><path d="M 623 942 L 641 942"/><path d="M 818 942 L 836 942"/><path d="M 1013 942 L 1031 942"/>
