<text x="75" y="936" font-size="12" fill="#475569">ImportView picks CSV</text>
<text x="75" y="954" font-size="12" fill="#475569">check → confirm → import</text>
<rect x="255" y="890" width="173" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
