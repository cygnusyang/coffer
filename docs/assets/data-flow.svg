<!-- ============ Flow F: Lock ============ -->
<text x="40" y="1056" font-size="18" fill="#0f172a" font-weight="700">Flow F · Lock &amp; Memory Wipe (lock / auto-lock)</text>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)">
<path d="M 233 1114 L 251 1114"/><path d="M 428 1114 L 446 1114"/><path d="M 623 1114 L 641 1114"/>
</g>
<rect x="60" y="1070" width="173" height="88" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="75" y="1094" font-size="15" fill="#0f172a" font-weight="700">Platform Timer</text>
<text x="75" y="1116" font-size="12" fill="#475569">Swift: AutoLockMonitor</text>
<text x="75" y="1134" font-size="12" fill="#475569">time injected by platform</text>
<rect x="255" y="1070" width="173" height="88" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="270" y="1094" font-size="15" fill="#0f172a" font-weight="700">cf-session</text>
<text x="270" y="1116" font-size="12" fill="#92400e">idle pure-fn check</text>
<text x="270" y="1134" font-size="12" fill="#92400e">auto_lock_if_expired</text>
<rect x="450" y="1070" width="173" height="88" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="465" y="1094" font-size="15" fill="#0f172a" font-weight="700">VaultSession.lock()</text>
<text x="465" y="1116" font-size="12" fill="#92400e">UnlockedState → None</text>
<text x="465" y="1134" font-size="12" fill="#92400e">or manual lock()</text>
<rect x="645" y="1070" width="173" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="744" y="1060" width="74" height="20" rx="6" fill="#f59e0b"/>
<text x="781" y="1074" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Key step</text>
<text x="660" y="1094" font-size="15" fill="#0f172a" font-weight="700">ZeroizeOnDrop</text>
<text x="660" y="1116" font-size="12" fill="#1e40af">Full chain: SubKeys, bufs</text>
<text x="660" y="1134" font-size="12" fill="#1e40af">wiped on drop, not elided</text>
<text x="1035" y="1100" font-size="12" fill="#94a3b8">cf-ffi: after lock()</text>
<text x="1035" y="1118" font-size="12" fill="#94a3b8">all data APIs return</text>
<text x="1035" y="1136" font-size="12" fill="#94a3b8">a locked error code</text>

<!-- footnotes -->
<text x="40" y="1210" font-size="14" fill="#64748b">Cross-cutting: DEK / SubKeys never cross FFI (gating and crypto enforced in Rust) · no crypto code in either UI · no network path here (NFR-SEC-07).</text>
<text x="40" y="1236" font-size="14" fill="#94a3b8">1PUX / opvault import and cf-exporter export (FR-8) not implemented — vault file is the sole data carrier. Based on cf-session / cf-store sources, docs/03 and docs/07 (2026-09-28).</text>
</g>
</svg>
