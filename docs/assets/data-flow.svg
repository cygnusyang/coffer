<text x="465" y="970" font-size="12" fill="#1e40af">bad otpauth → Notes</text>
<rect x="645" y="890" width="173" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="660" y="914" font-size="15" fill="#0f172a" font-weight="700">Field Mapping</text>
