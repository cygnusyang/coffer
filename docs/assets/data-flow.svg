<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1290" viewBox="0 0 1250 1290" role="img" aria-labelledby="title desc">
<title id="title">Coffer Key Data Flows</title>
<desc id="desc">Paths and key conversion points of six main flows across core modules: unlock, item read, item write, TOTP, CSV import, lock and wipe.</desc>
<defs>
<marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
</defs>
<rect width="1250" height="1290" rx="20" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="49" font-size="28" fill="#0f172a" font-weight="700">Coffer Data Flow · Six Main Flows</text>
<text x="40" y="78" font-size="16" fill="#64748b">Left → right · blocks match the crate map: blue = infrastructure · orange = app services · green = bindings · white = platform UI / result</text>

<!-- ============ Flow A: Unlock ============ -->
<text x="40" y="130" font-size="18" fill="#0f172a" font-weight="700">Flow A · Create / Unlock Vault (create_vault / open_vault)</text>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)">
<path d="M 233 200 L 251 200"/><path d="M 428 200 L 446 200"/><path d="M 623 200 L 641 200"/><path d="M 818 200 L 836 200"/><path d="M 1013 200 L 1031 200"/>
</g>
<!-- A1 -->
<rect x="60" y="150" width="173" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="75" y="174" font-size="15" fill="#0f172a" font-weight="700">UI (Swift)</text>
<text x="75" y="196" font-size="12" fill="#475569">LockView / VaultSetupView</text>
<text x="75" y="214" font-size="12" fill="#475569">Master password entry</text>
<text x="75" y="232" font-size="12" fill="#94a3b8">No crypto code</text>
<!-- A2 -->
<rect x="255" y="150" width="173" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="270" y="174" font-size="15" fill="#0f172a" font-weight="700">cf-ffi</text>
<text x="270" y="196" font-size="12" fill="#065f46">open_vault / create_vault</text>
<text x="270" y="214" font-size="12" fill="#065f46">session_call: panic catch</text>
<text x="270" y="232" font-size="12" fill="#065f46">Error codes → UI text</text>
<!-- A3 -->
<rect x="450" y="150" width="173" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="465" y="174" font-size="15" fill="#0f172a" font-weight="700">cf-session</text>
<text x="465" y="196" font-size="12" fill="#92400e">Unlock flow</text>
<text x="465" y="214" font-size="12" fill="#92400e">Unicode NFC normalize</text>
<text x="465" y="232" font-size="12" fill="#92400e">(cross-platform parity)</text>
<!-- A4 -->
<rect x="645" y="150" width="173" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="660" y="174" font-size="15" fill="#0f172a" font-weight="700">cf-format</text>
<text x="660" y="196" font-size="12" fill="#1e40af">Read header.json:</text>
<text x="660" y="214" font-size="12" fill="#1e40af">KDF params · salt</text>
<text x="660" y="232" font-size="12" fill="#1e40af">wrapped_dek · verifier</text>
<!-- A5 key step -->
<rect x="840" y="150" width="173" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="939" y="140" width="74" height="20" rx="6" fill="#f59e0b"/>
<text x="976" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Key step</text>
<text x="855" y="174" font-size="15" fill="#0f172a" font-weight="700">cf-crypto</text>
<text x="855" y="192" font-size="12" fill="#1e40af">Argon2id → KEK</text>
<text x="855" y="208" font-size="12" fill="#1e40af">AEAD unwrap → DEK</text>
<text x="855" y="224" font-size="12" fill="#1e40af">verifier const-time cmp</text>
<text x="855" y="240" font-size="12" fill="#1e40af">HKDF → SubKeys</text>
<!-- A6 -->
<rect x="1035" y="150" width="173" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="1050" y="174" font-size="15" fill="#0f172a" font-weight="700">cf-store</text>
<text x="1050" y="196" font-size="12" fill="#1e40af">ItemStore::open</text>
<text x="1050" y="214" font-size="12" fill="#1e40af">Holds conn + SubKeys</text>
<text x="1050" y="232" font-size="12" fill="#1e40af">SQLite opened</text>
<text x="60" y="282" font-size="13" fill="#334155">· Key hierarchy (3-level envelope): master password → KEK → DEK → SubKeys (item_key / field_key); plaintext master password wiped right after use (ZeroizeOnDrop)</text>
<text x="60" y="304" font-size="13" fill="#334155">· Unlock failures share one error: no telling a wrong password from corrupt data (docs/03 §2.6 verifier design) · KDF params come from header, so changing them keeps the vault valid</text>

<!-- ============ Flow B: Read Path ============ -->
<text x="40" y="346" font-size="18" fill="#0f172a" font-weight="700">Flow B · Item Read Path (get_item / search / get_field_value)</text>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)">
<path d="M 233 408 L 251 408"/><path d="M 428 408 L 446 408"/><path d="M 623 408 L 641 408"/><path d="M 818 408 L 836 408"/><path d="M 1013 408 L 1031 408"/>
</g>
<rect x="60" y="360" width="173" height="96" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="75" y="384" font-size="15" fill="#0f172a" font-weight="700">UI (Swift)</text>
<text x="75" y="406" font-size="12" fill="#475569">List / detail / search</text>
<text x="75" y="424" font-size="12" fill="#475569">get_item(item_id)</text>
<rect x="255" y="360" width="173" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="270" y="384" font-size="15" fill="#0f172a" font-weight="700">cf-ffi</text>
<text x="270" y="406" font-size="12" fill="#065f46">Concealed fields masked</text>
<text x="270" y="424" font-size="12" fill="#065f46">Real value only via</text>
<text x="270" y="440" font-size="12" fill="#065f46">get_field_value / TOTP</text>
<rect x="450" y="360" width="173" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="465" y="384" font-size="15" fill="#0f172a" font-weight="700">cf-session</text>
<text x="465" y="406" font-size="12" fill="#92400e">usecase orchestration</text>
<text x="465" y="424" font-size="12" fill="#92400e">Access gate: if locked</text>
<text x="465" y="440" font-size="12" fill="#92400e">deny all data access</text>
<rect x="645" y="360" width="173" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="660" y="384" font-size="15" fill="#0f172a" font-weight="700">cf-store</text>
<text x="660" y="406" font-size="12" fill="#1e40af">repo reads enc_* columns</text>
<text x="660" y="424" font-size="12" fill="#1e40af">items / fields / urls / tags</text>
<text x="660" y="440" font-size="12" fill="#1e40af">/ meta / totp (6 repos)</text>
<rect x="840" y="360" width="173" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="939" y="350" width="74" height="20" rx="6" fill="#f59e0b"/>
<text x="976" y="364" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Key step</text>
<text x="855" y="384" font-size="15" fill="#0f172a" font-weight="700">cf-crypto</text>
<text x="855" y="406" font-size="12" fill="#1e40af">aead::open field decrypt</text>
<text x="855" y="424" font-size="12" fill="#1e40af">AAD = field_aad(table,</text>
<text x="855" y="440" font-size="12" fill="#1e40af">UUID, col): blocks swap</text>
<rect x="1035" y="360" width="173" height="96" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="1050" y="384" font-size="15" fill="#0f172a" font-weight="700">Plaintext in RAM</text>
<text x="1050" y="406" font-size="12" fill="#475569">→ FfiItemDetails</text>
<text x="1050" y="424" font-size="12" fill="#475569">→ UI render</text>
<text x="1050" y="442" font-size="12" fill="#94a3b8">No disk, no FFI cache</text>

<!-- ============ Flow C: Write Path ============ -->
<text x="40" y="526" font-size="18" fill="#0f172a" font-weight="700">Flow C · Item Write Path (create_item / update_item / delete_item)</text>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)">
<path d="M 233 588 L 251 588"/><path d="M 428 588 L 446 588"/><path d="M 623 588 L 641 588"/><path d="M 818 588 L 836 588"/><path d="M 1013 588 L 1031 588"/>
</g>
<rect x="60" y="540" width="173" height="96" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="75" y="564" font-size="15" fill="#0f172a" font-weight="700">UI (Swift)</text>
<text x="75" y="586" font-size="12" fill="#475569">ItemEditView draft edit</text>
<text x="75" y="604" font-size="12" fill="#475569">FfiItemDraft submit</text>
<rect x="255" y="540" width="173" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="270" y="564" font-size="15" fill="#0f172a" font-weight="700">cf-ffi</text>
<text x="270" y="586" font-size="12" fill="#065f46">FfiItemDraft → domain</text>
<text x="270" y="604" font-size="12" fill="#065f46">types: two-way convert</text>
<rect x="450" y="540" width="173" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="465" y="564" font-size="15" fill="#0f172a" font-weight="700">cf-session + domain</text>
<text x="465" y="586" font-size="12" fill="#92400e">usecase orchestration</text>
<text x="465" y="604" font-size="12" fill="#92400e">domain checks: field type ·</text>
<text x="465" y="620" font-size="12" fill="#92400e">designation · required</text>
<rect x="645" y="540" width="173" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="744" y="530" width="74" height="20" rx="6" fill="#f59e0b"/>
<text x="781" y="544" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Key step</text>
<text x="660" y="564" font-size="15" fill="#0f172a" font-weight="700">cf-crypto</text>
<text x="660" y="586" font-size="12" fill="#1e40af">aead::seal per-field</text>
<text x="660" y="604" font-size="12" fill="#1e40af">item_key / field_key + AAD</text>
<text x="660" y="620" font-size="12" fill="#1e40af">per-column ciphertext</text>
<rect x="840" y="540" width="173" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="855" y="564" font-size="15" fill="#0f172a" font-weight="700">cf-store</text>
<text x="855" y="586" font-size="12" fill="#1e40af">with_tx one transaction</text>
<text x="855" y="604" font-size="12" fill="#1e40af">rollback (NFR-REL-01)</text>
<rect x="1035" y="540" width="173" height="96" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="1050" y="564" font-size="15" fill="#0f172a" font-weight="700">SQLite (11 tables)</text>
<text x="1050" y="586" font-size="12" fill="#475569">Sensitive cols encrypted</text>
<text x="1050" y="604" font-size="12" fill="#475569">enc_title / enc_value / …</text>
<text x="60" y="664" font-size="13" fill="#334155">· Delete is soft (trash) → restore brings it back; only hard delete removes it physically · history snapshots managed by cf-store (CBOR)</text>

