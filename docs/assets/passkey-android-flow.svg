<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Android Passkey Create / Use Flow (API 34+)</text>

  <!-- S1 -->
  <rect x="100" y="74" width="780" height="48" rx="8" fill="#EAF2FB" stroke="#3B82C4" stroke-width="1.5"/>
  <text x="490" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Website requests Passkey creation or use in browser / app</text>

  <line x1="490" y1="122" x2="490" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S2 -->
  <rect x="100" y="148" width="780" height="48" rx="8" fill="#EAF2FB" stroke="#3B82C4" stroke-width="1.5"/>
  <text x="490" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">System Credential Manager queries registered credential providers</text>

  <line x1="490" y1="196" x2="490" y2="222" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S3 -->
  <rect x="100" y="222" width="780" height="58" rx="8" fill="#EAF2FB" stroke="#3B82C4" stroke-width="1.5"/>
  <text x="490" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Coffer's CredentialProviderService is invoked</text>
  <text x="490" y="269" text-anchor="middle" font-size="11" fill="#444">Query phase: onBeginGetCredentialRequest / onBeginCreateCredentialRequest</text>

  <line x1="490" y1="280" x2="490" y2="306" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S4 -->
  <rect x="100" y="306" width="780" height="58" rx="8" fill="#EAF2FB" stroke="#3B82C4" stroke-width="1.5"/>
  <text x="490" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Rust core matches vault Passkeys by rpId → builds credential list</text>
  <text x="490" y="353" text-anchor="middle" font-size="11" fill="#444">Each item carries a PendingIntent, no private key</text>

  <line x1="490" y1="364" x2="490" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S5 -->
  <rect x="100" y="390" width="780" height="58" rx="8" fill="#EAF2FB" stroke="#3B82C4" stroke-width="1.5"/>
  <text x="490" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">User selects in the system picker</text>
  <text x="490" y="437" text-anchor="middle" font-size="11" fill="#444">PendingIntent launches Coffer's Activity</text>

  <line x1="490" y1="448" x2="490" y2="474" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S6 auth check -->
  <rect x="100" y="474" width="780" height="48" rx="8" fill="#FBF0E4" stroke="#C98A4B" stroke-width="1.5"/>
  <text x="490" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">[Auth] BiometricPrompt or master password</text>

  <line x1="490" y1="522" x2="490" y2="548" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S7 -->
  <rect x="100" y="548" width="780" height="58" rx="8" fill="#EAF2FB" stroke="#3B82C4" stroke-width="1.5"/>
  <text x="490" y="574" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Rust core signs with the private key</text>
  <text x="490" y="595" text-anchor="middle" font-size="11" fill="#444">Returned to the system via EXTRA_GET_CREDENTIAL_RESPONSE</text>

  <text x="490" y="634" text-anchor="middle" font-size="11" fill="#999">docs/02 · §4.6 · Android Passkey flow · API 34+</text>
</svg>
