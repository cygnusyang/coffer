<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">macOS Passkey Provider Extension Flow (macOS 14+)</text>

  <!-- S1 -->
  <rect x="100" y="74" width="780" height="48" rx="8" fill="#EAF7EE" stroke="#3B9E5F" stroke-width="1.5"/>
  <text x="490" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Website requests Passkey creation or use in Safari</text>

  <line x1="490" y1="122" x2="490" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S2 system side (dashed note box) -->
  <rect x="100" y="148" width="780" height="58" rx="8" fill="#F6F6F1" stroke="#8A8A7F" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="490" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">System invokes the enabled credential provider extension</text>
  <text x="490" y="195" text-anchor="middle" font-size="11" fill="#444">App Extension inside Coffer, separately signed target</text>

  <line x1="490" y1="206" x2="490" y2="232" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S3 -->
  <rect x="100" y="232" width="780" height="58" rx="8" fill="#EAF7EE" stroke="#3B9E5F" stroke-width="1.5"/>
  <text x="490" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">The extension is a separate process</text>
  <text x="490" y="279" text-anchor="middle" font-size="11" fill="#444">No direct access to the app's unlocked session</text>

  <line x1="490" y1="290" x2="490" y2="316" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S4 -->
  <rect x="100" y="316" width="780" height="58" rx="8" fill="#EAF7EE" stroke="#3B9E5F" stroke-width="1.5"/>
  <text x="490" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Extension asks the main app to sign once</text>
  <text x="490" y="363" text-anchor="middle" font-size="11" fill="#444">It never requests the DEK</text>

  <line x1="490" y1="374" x2="490" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S5 auth check -->
  <rect x="100" y="400" width="780" height="48" rx="8" fill="#FBF0E4" stroke="#C98A4B" stroke-width="1.5"/>
  <text x="490" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">[Auth] Touch ID</text>

  <line x1="490" y1="448" x2="490" y2="474" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S6 -->
  <rect x="100" y="474" width="780" height="58" rx="8" fill="#EAF7EE" stroke="#3B9E5F" stroke-width="1.5"/>
  <text x="490" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Main app decrypts and signs</text>
  <text x="490" y="521" text-anchor="middle" font-size="11" fill="#444">Result back to extension → extension returns to system</text>

  <text x="490" y="558" text-anchor="middle" font-size="11" fill="#999">docs/02 · §4.6 · macOS Passkey provider extension flow · macOS 14+</text>
</svg>
