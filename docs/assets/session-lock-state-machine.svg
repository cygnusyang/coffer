<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="b2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Session and Lock State Machine</text>
  <text x="960" y="96" text-anchor="end" font-size="11" fill="#666">State labels</text>

  <!-- Locked -->
  <rect x="90" y="120" width="260" height="130" rx="10" fill="#F5F5F5" stroke="#999" stroke-width="1.5"/>
  <text x="220" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Locked</text>
  <text x="220" y="202" text-anchor="middle" font-size="13" fill="#555">keys = empty</text>

  <!-- Unlocked -->
  <rect x="560" y="120" width="260" height="130" rx="10" fill="#EAF7EE" stroke="#3B9E5F" stroke-width="1.5"/>
  <text x="690" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Unlocked</text>
  <text x="690" y="202" text-anchor="middle" font-size="13" fill="#555">DEK in memory</text>

  <!-- Unlock transition: Locked → Unlocked -->
  <line x1="350" y1="160" x2="560" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#b2-arr)"/>
  <text x="455" y="152" text-anchor="middle" font-size="12" fill="#444">Master password / biometrics</text>

  <!-- Lock transition: Unlocked → Locked -->
  <line x1="560" y1="220" x2="350" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#b2-arr)"/>
  <text x="455" y="240" text-anchor="middle" font-size="12" fill="#444">Idle / screen lock / manual lock</text>

  <!-- Allowed actions, attached below-right of Unlocked -->
  <line x1="785" y1="250" x2="785" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#b2-arr)"/>
  <rect x="655" y="290" width="260" height="76" rx="8" fill="#F2F2F2" stroke="#999" stroke-width="1.5"/>
  <text x="785" y="322" text-anchor="middle" font-size="12"><tspan font-weight="bold" fill="#222">Allowed: </tspan><tspan fill="#444">query, create, edit,</tspan></text>
  <text x="785" y="346" text-anchor="middle" font-size="12" fill="#444">delete, import/export, fill</text>

  <text x="490" y="400" text-anchor="middle" font-size="11" fill="#999">docs/02 · §4.3 · Session and lock state machine (Locked ⇄ Unlocked)</text>
</svg>
