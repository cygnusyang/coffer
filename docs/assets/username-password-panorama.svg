  <!-- ===== R2 discipline red line ===== -->
  <rect x="50" y="418" width="900" height="58" rx="8" fill="#FDECEC" stroke="#C43B3B" stroke-width="1.5"/>
  <text x="500" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#A03030">R2 zero-leak rule: passwords travel only via stdin / masked display / child env — never in argv / logs / protocol frames / model context</text>
  <text x="500" y="462" text-anchor="middle" font-size="12" fill="#A03030">username is low-sensitivity: App / CLI read-write, MCP read-only (v2.8.1); no MCP write path; browser capture retired (v2.4.0)</text>

  <text x="490" y="510" text-anchor="middle" font-size="11" fill="#999">docs/02-Overview §6.5 · username / password I/O panorama · v2.8.1 · 2026-10-10</text>
