<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1c1c1e;
        --muted: #6b6b70;
        --accent: #0a66c2;
        --danger: #d93025;
        --border: #d9d9de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2c2c2e;
          --fg: #f2f2f7;
          --muted: #98989f;
          --accent: #6cb2ff;
          --danger: #ff6961;
          --border: #45454a;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font: 13px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      .head .logo {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .head .origin {
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .warn {
        margin: 8px 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(217, 48, 37, 0.12);
        border: 1px solid rgba(217, 48, 37, 0.35);
        color: var(--danger);
        font-size: 12px;
      }
      .list {
        max-height: 300px;
        overflow-y: auto;
      }
      .entry {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .entry:hover {
        background: rgba(127, 127, 127, 0.15);
      }
      .entry .sub {
        color: var(--muted);
        font-size: 11px;
      }
      .status {
        padding: 16px 12px;
        text-align: center;
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 8px;
        padding: 12px;
      }
      button.primary,
      button.ghost {
        flex: 1;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.ghost {
        background: transparent;
        color: inherit;
      }
      .detail {
        padding: 0 12px 8px;
        color: var(--muted);
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="inline_menu.js"></script>
  </body>
</html>
