<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1c1c1e;
        --muted: #6b6b70;
        --accent: #0a66c2;
        --danger: #d93025;
        --border: #d9d9de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2c2c2e;
          --fg: #f2f2f7;
          --muted: #98989f;
          --accent: #6cb2ff;
          --danger: #ff6961;
          --border: #45454a;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 300px;
        font: 13px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 0;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.connected {
        background: #34c759;
      }
      .dot.warn {
        background: #ff9f0a;
      }
      .dot.err {
        background: var(--danger);
      }
      #status {
        flex: 1;
      }
      main {
        padding: 8px 0;
        max-height: 360px;
        overflow-y: auto;
      }
      .hint {
        margin: 8px 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(255, 159, 10, 0.14);
        border: 1px solid rgba(255, 159, 10, 0.4);
        font-size: 12px;
      }
      .entry {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .entry:hover {
        background: rgba(127, 127, 127, 0.15);
      }
      .empty {
        padding: 14px 12px;
        text-align: center;
        color: var(--muted);
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
      }
      button {
        flex: 1;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot"></span>
      <span id="status">…</span>
    </header>
    <main>
      <div id="unlock-hint" class="hint" hidden>
        Coffer 已锁定或未运行。请在 Coffer App 中解锁后重试。
      </div>
      <div id="entries"></div>
    </main>
    <footer>
      <button id="retry">刷新</button>
      <button id="lock" class="primary" hidden>锁定</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
